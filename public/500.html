<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Oups ! Erreur serveur (500)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* 🎨 Couleurs */
    :root {
      --color-primary: #00524F;
      --color-secondary: #FCBF38;
      --color-accent: #FFB84D;
      --color-light: #FFFFFF;
      --color-muted: #9CA3AF;
      --color-background: #F4FAFD;
    }

    /* ✍️ Typographie */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--color-background);
      color: var(--color-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }

    h1 {
      font-family: 'Modak', sans-serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1rem;
      color: var(--color-muted);
      margin: 0.5rem 0 1.5rem;
    }

    /* 🔘 Bouton */
    .btn-home {
      background-color: var(--color-secondary);
      color: var(--color-light);
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn-home:hover {
      background-color: var(--color-accent);
    }

    /* 🖼️ Card style */
    .error-card {
      background-color: var(--color-background);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="emoji">🔥👨‍🍳</div>
    <h1>Oups ! Le serveur a surchauffé</h1>
    <p>Notre cuisine a pris feu (numériquement)… On répare ça rapidement !</p>
    <a href="/" class="btn-home">Retour à l'accueil</a>
  </div>
</body>
</html>
